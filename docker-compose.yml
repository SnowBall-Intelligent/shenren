# Default stack: app talks to MySQL on the Docker host.
#   docker compose up -d
#   DATABASE_URL defaults to mysql://shenren:shenren@host.docker.internal:3306/shenren
#
# Bundled MySQL (CI manual/release, or local opt-in):
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d

services:
  app:
    image: ${SHENREN_IMAGE:-shenren:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://shenren:shenren@host.docker.internal:3306/shenren}
      BIND_ADDR: 0.0.0.0:3000
      UPLOADS_DIR: /data/uploads
      LOG_ENABLED: ${LOG_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_TIMEZONE: ${LOG_TIMEZONE:-UTC}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - shenren_uploads:/data/uploads
      - shenren_logs:/app/data/logs
    restart: unless-stopped

volumes:
  shenren_uploads:
  shenren_logs:
