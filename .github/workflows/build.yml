name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      with_mysql:
        description: Use Compose MySQL for a startup smoke test
        type: boolean
        default: true
      push_image:
        description: Push the image to GHCR
        type: boolean
        default: true
  release:
    types: [published, edited]

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    # Any published release (including prereleases). Also rebuild when a
    # prerelease is converted to a full release (no second `published` event).
    if: >
      github.event_name != 'release' ||
      github.event.action == 'published' ||
      (github.event.action == 'edited' &&
       github.event.changes.prerelease.from == true &&
       !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      WITH_MYSQL: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.with_mysql) }}
      PUSH_IMAGE: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch,enable=${{ github.event_name == 'push' }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Linux binary
        run: |
          tag="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          cid="$(docker create "$tag")"
          docker cp "$cid":/app/shenren ./shenren-x86_64-unknown-linux-gnu
          docker rm "$cid"
          chmod +x ./shenren-x86_64-unknown-linux-gnu
          file ./shenren-x86_64-unknown-linux-gnu

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: shenren-x86_64-unknown-linux-gnu
          path: shenren-x86_64-unknown-linux-gnu
          if-no-files-found: error

      - name: Smoke test with Compose MySQL
        if: env.WITH_MYSQL == 'true'
        run: |
          export SHENREN_IMAGE="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Using image $SHENREN_IMAGE"
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --wait --wait-timeout 180
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/api/site
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml logs app
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml down -v

      - name: Push image to GHCR
        if: env.PUSH_IMAGE == 'true'
        run: |
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done

      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./shenren-x86_64-unknown-linux-gnu \
            --clobber
