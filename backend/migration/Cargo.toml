[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dependencies.sea-orm-migration]
version = "1.1"
features = [
  "runtime-tokio-rustls",
  "sqlx-sqlite",
  "sqlx-mysql",
  "with-chrono",
]
